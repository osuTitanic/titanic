# Expected to be run from the repository root
# air -c services/deck/.air.toml

root = "."
tmp_dir = "tmp/deck"

[build]
args_bin = []
bin = "./tmp/deck/main"
cmd = "go build -o ./tmp/deck/main ./services/deck/cmd/api/"
delay = 1000
exclude_dir = [".github", ".data", "tmp", "migrations", "scripts"]
exclude_file = []
exclude_regex = ["_test\\.go$"]
exclude_unchanged = false
follow_symlink = false
full_bin = ""
include_dir = ["services/deck", "internal"]
include_ext = ["go"]
include_file = []
kill_delay = "0s"
log = "build-errors.log"
poll = false
poll_interval = 0
post_cmd = []
pre_cmd = []
rerun = false
rerun_delay = 500
send_interrupt = false
stop_on_error = true

[build.windows]
bin = "./tmp/deck/main.exe"
cmd = "go build -o ./tmp/deck/main.exe ./services/deck/cmd/api/"

[color]
app = ""
build = "yellow"
main = "magenta"
runner = "green"
watcher = "cyan"

[log]
main_only = false
time = false

[misc]
clean_on_exit = false

[screen]
clear_on_rebuild = false
keep_scroll = true
