name: FFmpeg

on:
  push:
    branches:
      - main
    paths:
      - ".github/docker/ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"
  pull_request:
    paths:
      - ".github/docker/ffmpeg/**"
      - ".github/workflows/ffmpeg.yml"
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ffmpeg-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/osutitanic/ffmpeg
          tags: |
            type=raw,value=trixie
            type=raw,value=latest
            type=sha,format=short,prefix=sha-
          labels: |
            org.opencontainers.image.title=ffmpeg
            org.opencontainers.image.description=Minimal ffmpeg build for Titanic

      - name: Build and publish ffmpeg image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/ffmpeg/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: ${{ github.ref == 'refs/heads/main' }}
          pull: true
          build-args: |
            FFMPEG_REFRESH=${{ github.run_id }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=ffmpeg
          cache-to: type=gha,scope=ffmpeg,mode=max
